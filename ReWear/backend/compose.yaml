services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: closetcycle
      POSTGRES_USER: closetcycle
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting Compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closetcycle -d closetcycle"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/closetcycle
      DATABASE_USER: closetcycle
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before starting Compose}
      CLOSET_CYCLE_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:8443
      UPLOAD_DIR: /app/uploads
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
volumes:
  postgres_data:
  upload_data:

spring.application.name=closet-cycle-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/closetcycle;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
closetcycle.upload-dir=${UPLOAD_DIR:./uploads}
closetcycle.jwt-secret=${CLOSET_CYCLE_JWT_SECRET:}
closetcycle.allowed-origins=${CLOSET_CYCLE_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8443}
closetcycle.razorpay.key-id=${RAZORPAY_KEY_ID:}
closetcycle.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
closetcycle.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
